function dashboard(){const yr=+(window.dashYear||years()[0]||2026),items=data.filter(x=>yearOf(x)===yr),metric=k=>sumBy(items,k),pressEvents=items.filter(x=>x.category==='press').length,designRecords=items.filter(x=>x.category==='design').length,designUnits=metric('design'),links=items.reduce((n,x)=>n+nLinks(x),0),monthly=Array.from({length:12},(_,i)=>{let m=i+1,arr=items.filter(x=>monthOf(x)===m);return {m,total:arr.reduce((n,x)=>n+recordMeasure(x),0)}}),maxMonth=Math.max(1,...monthly.map(x=>x.total)),maxCat=Math.max(1,...Object.keys(cats).map(metric));$('#app').innerHTML=`<div class="heading"><div><h1>Tổng quan truyền thông</h1><div class="sub">Bức tranh sản lượng truyền thông theo năm, nhóm dữ liệu và tiến độ từng tháng.</div></div><div class="actions"><select class="field year-select" onchange="dashYear=+this.value;dashboard()">${years().map(y=>`<option value="${y}" ${y===yr?'selected':''}>Năm ${y}</option>`).join('')}</select><button class="btn primary" onclick="openAdd()">＋ Thêm minh chứng</button></div></div><div class="dash-kpis"><div class="kpi"><span class="klabel">Tổng bản ghi</span><b>${items.length.toLocaleString('vi-VN')}</b><small>Trong năm ${yr}</small></div><div class="kpi"><span class="klabel">Link minh chứng</span><b>${links.toLocaleString('vi-VN')}</b><small>Bao gồm tất cả nhóm dữ liệu</small></div><div class="kpi"><span class="klabel">Sự kiện báo chí</span><b>${pressEvents.toLocaleString('vi-VN')}</b><small>${metric('press').toLocaleString('vi-VN')} link báo chí</small></div><div class="kpi"><span class="klabel">Sản lượng thiết kế</span><b>${designUnits.toLocaleString('vi-VN')}</b><small>${designRecords.toLocaleString('vi-VN')} bản ghi thiết kế · theo cột Số lượng</small></div><div class="kpi"><span class="klabel">Tháng có dữ liệu</span><b>${monthly.filter(x=>x.total>0).length}/12</b><small>Tháng có phát sinh bản ghi</small></div></div><div class="dash-grid"><div class="panel"><h3>📈 Sản lượng theo tháng · ${yr}</h3><div class="month-chart">${mon function dateValue(v){let m=String(v||'').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);return m?new Date(+m[3],+m[2]-1,+m[1]).getTime():0}
function monthValue(x){let src=[x.month,x.date,x.note,x.title].filter(Boolean).join(' ');let m=src.match(/(?:THÁNG|Tháng)\s*(\d{1,2})\s*\/\s*(\d{4})/i);if(m)return +m[2]*100 + +m[1];let t=String(x.date||'').match(/\d{1,2}\/(\d{1,2})\/(\d{4})/);return t?+t[3]*100 + +t[2]:0}
function monthLabel(x){if(x.month)return x.month;let src=[x.date,x.note,x.title].filter(Boolean).join(' ');let m=src.match(/(?:THÁNG|Tháng)\s*(\d{1,2})\s*\/\s*(\d{4})/i);if(m)return `Tháng ${+m[1]}/${m[2]}`;let d=String(x.date||'').match(/\d{1,2}\/(\d{1,2})\/(\d{4})/);return d?`Tháng ${+d[2]}/${d[3]}`:'Chưa xác định tháng'}
function listing(k){let c=cats[k];const refocus=document.activeElement?.id==='q',caret=refocus?$('#q').selectionStart:0;let q=$('#q')?.value||'',m=$('#month')?.value||'';let rows=data.filter(x=>x.category===k).filter(x=>(!m||monthLabel(x)===m||x.date.includes(m))).filter(x=>hay(x).includes(q.toLowerCase()));

let pages=Math.max(1,Math.ceil(rows.length/perPage));page=Math.min(page,pages);let slice=rows.slice((page-1)*perPage,page*perPage);let lastMonth='';
let body=slice.map(x=>{let ml=monthLabel(x),head=ml!==lastMonth?`<tr class="month-row"><td colspan="${k==='design'?6:(k==='fanpage'||k==='webufl'?7:5)}">${esc(ml)}</td></tr>`:'';lastMonth=ml;return head+`<tr><td>${esc(x.stt)}</td>${k!=='design'?`<td>${esc(x.date)}</td>`:''}<td class="titlecell">${esc(x.title||'(Chưa có nội dung)')}<small>${esc(ml)}${k==='press'?` · ${((x.links||[]).filter(Boolean)).length} link minh chứng`:''}</small></td><td class="links">${(x.links||[]).map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener">↗ ${esc(u)}</a>`).join('')||'<span class="muted">Chưa có link</span>'}${(x.files||[]).map(f=>`<button class="btn" onclick="downloadAttachment('${f.id}')">📎 ${esc(f.name)}</button>`).join('')}</td>${k==='design'?`<td>${esc(x.quantity)}</td><td>${esc(x.note)}</td>`:''}${k==='fanpage'?`<td>${esc(x.owner)}</td><td>${esc(x.note)}</td>`:''}${k==='webufl'?`<td>${esc(x.owner)}</td><td>${esc(x.note)}</td>`:''}<td><button class="btn" onclick="editRecord('${x.id}')">Sửa</button> <button class="btn" onclick="delRecord('${x.id}')">Xóa</button></td></tr>`}).join('');
$('#app').innerHTML=`<div class="heading"><div><h1>${c.name}</h1><div class="sub">${c.desc} · ${k==='press'?rows.length+' sự kiện · '+rows.reduce((n,x)=>n+(x.links||[]).filter(Boolean).length,0)+' link minh chứng':k==='design'?rows.reduce((n,x)=>n+numQty(x),0).toLocaleString('vi-VN')+' sản phẩm · '+rows.length+' bản ghi thiết kế':rows.length+' bản ghi'} · Sắp xếp mới nhất trước</div></div><div class="actions"><button class="btn" onclick="exportCSV('${k}')">Xuất CSV</button><button class="btn primary" onclick="openAdd('${k}')">＋ Thêm bản ghi</button></div></div><div class="filters"><input id="q" class="field search" placeholder="Tìm nội dung, link, người đăng, đơn vị..." value="${esc(q)}"><select id="month" class="field"><option value="">Tất cả tháng</option>${years().flatMap(y=>Array.from({length:12},(_,i)=>`<option ${m===`Tháng ${i+1}/${y}`?'selected':''}>Tháng ${i+1}/${y}</option>`)).join('')}</select><button class="btn" onclick="document.getElementById('q').value='';document.getElementById('month').value='';listing('${k}')">Xóa lọc</button></div><div class="tablewrap"><table><thead><tr><th>STT</th>${k!=='design'?'<th>Ngày</th>':''}<th>Nội dung</th><th>Minh chứng / Link</th>${k==='design'?'<th>Số lượng</th><th>Ghi chú</th>':''}${k==='fanpage'?'<th>Người đăng</th><th>Ghi chú</th>':''}${k==='webufl'?'<th>ĐV chủ trì</th><th>Ghi chú</th>':''}<th>Thao tác</th></tr></thead><tbody>${body||'<tr><td colspan="8" class="empty">Không tìm thấy bản ghi phù hợp.</td></tr>'}</tbody></table></div><div class="pager"><span>Trang ${page}/${pages} · Hiển thị ${slice.length}/${rows.length}</span><div><button class="btn" ${page<=1?'disabled':''} onclick="page--;listing('${k}')">← Trước</button> <button class="btn" ${page>=pages?'disabled':''} onclick="page++;listing('${k}')">Sau →</button></div></div>`;const qi=$('#q');if(refocus){qi.focus();qi.setSelectionRange(caret,caret)}const run=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{page=1;listing(k)},150)};qi.addEventListener function reports(){
const yr=+(window.reportYear||years()[0]||2026);const getMonth=x=>yearOf(x)===yr?monthOf(x):0;
const inMonth=(k,mo)=>data.filter(x=>x.category===k&&getMonth(x)===mo);
const rows=Array.from({length:12},(_,i)=>{let mo=12-i,design=inMonth('design',mo);return {mo,web:inMonth('webufl',mo).length,pressEvents:inMonth('press',mo).length,press:inMonth('press',mo).reduce((n,x)=>n+(x.links||[]).filter(Boolean).length,0),udn:inMonth('webudn',mo).length,design:design.reduce((n,x)=>n+numQty(x),0),video:(yr===2026?[2,3,0,2,2,0,4,1,2,1,0,0][mo-1]:design.filter(x=>/VIDEO/i.test((x.note||'')+' '+(x.title||''))).reduce((n,x)=>n+numQty(x),0)),fanpage:inMonth('fanpage',mo).length}});
const total=key=>rows.reduce((n,x)=>n+x[key],0);
$('#app').innerHTML=`<div class="heading"><div><h1>Tổng hợp báo cáo</h1><div class="sub">Sản lượng được phân tách theo từng tháng và từng nhóm chỉ tiêu.</div></div><div class="actions"><select class="field year-select" onchange="reportYear=+this.value;reports()">${years().map(y=>`<option value="${y}" ${y===yr?'selected':''}>Năm ${y}</option>`).join('')}</select><button class="btn primary" onclick="window.print()">In / Lưu PDF</button></div></div>
<div class="panel"><h3>Bảng tổng hợp sản lượng theo tháng – năm ${yr}</h3><div class="sub" style="margin:-6px 0 14px">Báo, đài tách số sự kiện và số URL minh chứng; Website tính theo số tin/bài; Thiết kế tính theo trường số lượng. Video năm 2026 sử dụng số lượng tổng hợp theo tháng.</div><div class="tablewrap"><table style="min-width:850px"><thead><tr><th>Thời gian</th><th>Web UFLS</th><th>Sự kiện báo chí</th><th>Báo, đài<br><small>Link</small></th><th>Web Đại học Đà Nẵng</th><th>Thiết kế</th><th>Video</th><th>Fanpage</th></tr></thead><tbody>${rows.map(x=>`<tr><td><b>Tháng ${x.mo}/${yr}</b></td><td>${x.web}</td><td>${x.pressEvents}</td><td>${x.press}</td><td>${x.udn}</td><td>${x.design}</td><td>${x.video}</td><td>${x.fanpage}</td></tr>`).join('')}<tr style="background:#f2f2fa;font-weight:800"><td>TỔNG CỘNG</td><td>${total('web')}</td><td>${total('pressEvents')}</td><td>${total('press')}</td><td>${total('udn')}</td><td>${total('design')}</td><td>${total('video')}</td><td>${total('fanpage')}</td></tr></tbody></table></div></div>

<div class="notice">Lưu ý: Mỗi sự kiện báo chí là một bản ghi, nhưng số liệu Báo, đài cộng theo từng URL hợp lệ. Thiết kế lấy số lượng từ trường số lượng; Video năm 2026 lấy theo bảng số lượng video tổng hợp từng tháng (tháng 12 hiện là 0). Fanpage được thống kê riêng để tiện theo dõi.</div>`

function openAdd(k=view){editing=null;$('#modalTitle').textContent='Thêm minh chứng';buildForm(k,{});$('#modal').classList.add('open')}
function editRecord(id){let x=data.find(y=>y.id===id);editing=id;$('#modalTitle').textContent='Chỉnh sửa bản ghi';buildForm(x.category,x);$('#modal').classList.add('open')}
function buildForm(k,x){let fields=[['category','Nhóm dữ liệu','select',k],['date','Ngày tháng','text',x.date||''],['month','Tháng báo cáo','select',x.month||''],['title','Nội dung / tiêu đề','textarea',x.title||''],['links','Các đường dẫn minh chứng (mỗi link một dòng)','textarea',(x.links||[]).join('\n')],['owner',k==='fanpage'?'Người đăng':'Đơn vị chủ trì','text',x.owner||''],['quantity','Số lượng sản phẩm','text',x.quantity||''],['note','Ghi chú / loại sản phẩm','textarea',x.note||''],['file','Đính kèm file minh chứng','file','']];let html='';for(let [id,label,type,val] of fields){if(id==='owner'&&k!=='fanpage'&&k!=='webufl')continue;if(id==='quantity'&&k!=='design')continue;if(id==='note'&&!['design','fanpage','webufl'].includes(k))continue;let input=type==='select'?(id==='category'?`<select name="${id}">${Object.entries(cats).map(([a,b])=>`<option value="${a}" ${a===val?'selected':''}>${b.name}</option>`).join('')}</select>`:`<select name="${id}"><option value="">Chọn tháng</option>${[...new Set([...years(),new Date().getFullYear()+1])].sort((a,b)=>a-b).flatMap(y=>Array.from({length:12},(_,i)=>`<option ${val===`Tháng ${i+1}/${y}`?'selected':''}>Tháng ${i+1}/${y}</option>`)).join('')}</select>`):type==='textarea'?`<textarea name="${id}">${esc(val)}</textarea>`:`<input name="${id}" type="${type}" value="${esc(val)}" ${type==='file'?'multiple':''}>`;html+=`<div class="formitem ${['title','links','note','file'].includes(id)?'full':''}"><label>${label}</label>${input}</div>`}$('#formFields').innerHTML=html;$('#recordForm').onsubmit=async e=>{e.preventDefault();let fd=new FormData(e.target),cat=fd.get('category'),id=editing||('new-'+Date.now());let old=data.find(z=>z.id===editing)||{};let links=String(fd.get('links')||'').split(/\n|,|;/).map(s=>s.trim()).filter(s=>/^https?:\/\//i.test(s));let obj={...old,id,category:cat,categoryLabel:cats[cat].name,date:fd.get('date')||'',month:fd.get('month')||'',title:fd.get('title')||'',links,owner:fd.get('owner')||'',quantity:fd.get('quantity')||'',note:fd.get('note')||'',files:old.files||[],stt:old.stt||'Mới',source:old.source||'Nhập trực tiếp'};let chosen=[...e.target.querySelector('[name=file]').files];for(let f of chosen){let fid=id+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);await putAttachment({id:fid,name:f.name,type:f.type,size:f.size,blob:f});obj.files.push({id:fid,name:f.name,size:f.size,type:f.type})};if(editing)data=data.map(z=>z.id===editing?obj:z);else data.unshift(obj);save();closeModal();render()}}
function closeModal(){$('#modal').classList.remove('open')};function delRecord(id){if(confirm('Xóa bản ghi này khỏi dữ liệu trên trình duyệt?')){rmAttachments((data.find(x=>x.id===id)?.files||[]).map(f=>f.id));data=data.filter(x=>x.id!==id);save();render()}}
function exportCSV(k){let rows=data.filter(x=>!k||x.category===k),headers=['Nhóm','STT','Ngày','Tháng','Nội dung','Minh chứng','Số lượng','Người đăng/Đơn vị chủ trì','Ghi chú','File đính kèm'];let csv=[headers,...rows.map(x=>[x.categoryLabel,x.stt,x.date,x.month,x.title,x.links.join(' | '),x.quantity,x.owner,x.note,(x.files||[]).map(f=>f.name).join(' | ')])].map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download((k||'ufls-all')+'-2026.csv','\ufeff'+csv,'text/csv;charset=utf-8')}
function download(name,content,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
let dbP;function openDB(){return dbP||(dbP=new Promise((resolve,reject)=>{let r=indexedDB.open('uflsEvidenceFiles',1);r.onupgradeneeded=()=>r.result.createObjectStore('attachments',{keyPath:'id'});r.onsuccess=()=>resolve(r.result);r.onerror=()=>{dbP=null;reject(r.error)}}))}async function rmAttachments(ids){if(!ids.length)return;let s=(await openDB()).transaction('attachments','readwrite').objectStore('attachments');ids.forEach(i=>s.delete(i))}async function putAttachment(item){let db=await openDB();return new Promise((resolve,reject)=>{let tx=db.transaction('attachments','readwrite');tx.objectStore('attachments').put(item);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}async function downloadAttachment(id){let db=await openDB();let item=await new Promise((resolve,reject)=>{let r=db.transaction('attachments').objectStore('attachments').get(id);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});if(!item){alert('Không tìm thấy file đính kèm trong bộ nhớ trình duyệt này.');return}let a=document.createElement('a'),u=URL.createObjectURL(item.blob);a.href=u;a.download=item.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function resetData(){if(confirm('Khôi phục dữ liệu gốc từ 5 file Word? Mọi chỉnh sửa trên trình duyệt sẽ mất.')){data=fillDesignMonths(fresh());save();render()}}
